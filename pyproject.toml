[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docs-agent"
version = "1.0.0"
description = "A local bilingual technical-document Agentic RAG application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jieba==0.42.1", "rank-bm25==0.2.2", "pypdf>=6,<7",
  "fastembed==0.8.1", "qdrant-client==1.19.1", "langgraph==1.2.12",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_docs_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

